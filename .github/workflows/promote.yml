name: Propose GitOps promotion
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [dev, production]
        required: true
      image_ref:
        description: Signed ghcr.io/.../platform-api@sha256:... from verified release
        type: string
        required: true
      version:
        description: Source commit SHA or reviewed release version
        type: string
        required: true
permissions:
  contents: read
jobs:
  propose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.target }}-promotion
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install PyYAML==6.0.2
      - uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2
        with:
          cosign-release: v2.4.3
      - name: Verify release identity before touching values
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
          GH_TOKEN: ${{ github.token }}
          CONFIRMED: ${{ vars.PROMOTION_GUARDS_CONFIRMED }}
        run: |
          test "$CONFIRMED" = true
          [[ "$IMAGE_REF" =~ ^ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/platform-api@sha256:[a-f0-9]{64}$ ]]
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/application-release.yml@refs/heads/main"
          cosign verify --certificate-identity "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE_REF"
          cosign verify-attestation --type spdxjson --certificate-identity "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE_REF"
      - name: Mint a repository-scoped promotion token
        id: promotion-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.PROMOTION_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROMOTION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Update one environment
        env:
          TARGET: ${{ inputs.target }}
          IMAGE_REF: ${{ inputs.image_ref }}
          VERSION: ${{ inputs.version }}
        run: python3 scripts/promote.py "$TARGET" "${IMAGE_REF%@*}" "${IMAGE_REF#*@}" "$VERSION"
      - name: Open reviewable promotion PR
        env:
          GH_TOKEN: ${{ steps.promotion-token.outputs.token }}
          TARGET: ${{ inputs.target }}
        run: |
          branch="promotion/$TARGET/$GITHUB_RUN_ID"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add "environments/$TARGET/values.yaml"
          git commit -m "Promote verified image digest to $TARGET"
          gh auth setup-git
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Promote verified image to $TARGET" --body 'Updates only the environment image digest and release metadata after signature and SBOM verification. Review the values diff, CI results, and Argo CD sync policy before merging. This workflow never merges its own PR.'
