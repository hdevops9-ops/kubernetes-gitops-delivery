apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-dev
  namespace: argocd
spec:
  sourceRepos:
  - https://github.com/hdevops9-ops/kubernetes-gitops-delivery.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: platform-dev
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
  - group: apps
    kind: Deployment
  - group: ''
    kind: Service
  - group: policy
    kind: PodDisruptionBudget
  - group: autoscaling
    kind: HorizontalPodAutoscaler
  - group: networking.k8s.io
    kind: NetworkPolicy
  - group: networking.k8s.io
    kind: Ingress
