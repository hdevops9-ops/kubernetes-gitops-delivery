apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-web
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hdevops9-ops/kubernetes-gitops-delivery.git
    targetRevision: main
    path: k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-lab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
